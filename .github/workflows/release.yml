name: Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  # Nothing is created or published until the tagged commit is known-good.
  # Branch protection cannot cover this: a tag push carries no checks of its
  # own, so readiness is verified here against the commit the tag points at.
  verify-readiness:
    name: Verify Release Readiness
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a successful Release Readiness run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-readiness.yml/runs?head_sha=${GITHUB_SHA}&status=success" \
            --jq '.total_count')

          if [ "${count}" -eq 0 ]; then
            echo "::error::No successful Release Readiness run for ${GITHUB_SHA} (tag ${GITHUB_REF_NAME})."
            echo "The full test cadence has not passed on this commit, so nothing will be published."
            echo ""
            echo "To fix: drop the tag, run the cadence on the branch holding this"
            echo "commit, then re-tag once it is green. workflow_dispatch takes a"
            echo "branch or tag name, not a SHA, so dispatch against main:"
            echo "  git push --delete origin ${GITHUB_REF_NAME} && git tag -d ${GITHUB_REF_NAME}"
            echo "  gh workflow run release-readiness.yml --ref main"
            echo "  git tag ${GITHUB_REF_NAME} && git push origin ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "Found ${count} successful Release Readiness run(s) for ${GITHUB_SHA}."

  create-release:
    name: Create GitHub Release
    needs: verify-readiness
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Create the release up front so the parallel build jobs only ever
      # upload assets to it. Creating it per-platform races: whichever job
      # POSTs first wins and the others fail with 422 "already_exists".
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "Release ${GITHUB_REF_NAME}" \
                 --generate-notes

  # Every packaged app carries ffmpeg, ffprobe and fluidsynth for its target;
  # electron-builder's beforePack hook refuses to package without them.
  binaries:
    name: Bundled Binaries
    needs: verify-readiness
    uses: ./.github/workflows/binaries.yml

  # The GPL and LGPL require the corresponding source of the bundled binaries
  # to be offered alongside them.
  publish-sources:
    name: Publish Binary Sources
    needs: [create-release, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries-sources
          path: sources

      - name: Attach the sources to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" sources/* --clobber --repo "${GITHUB_REPOSITORY}"

  release:
    name: Build & Release (${{ matrix.os }})
    needs: [create-release, binaries]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v4
        id: deps
        with:
          path: node_modules
          key: node-modules-${{ matrix.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-${{ matrix.platform }}-*
          path: binaries-download
          merge-multiple: true

      - name: Unpack bundled binaries
        shell: bash
        run: |
          mkdir -p vendor/bin
          for archive in binaries-download/*.tar; do
            tar -xf "${archive}" -C vendor/bin
          done
          ls vendor/bin

      - name: Build application
        run: npm run build:all

      - name: Obfuscate code
        run: npm run obfuscate

      - name: Build and publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.platform }} --publish always
