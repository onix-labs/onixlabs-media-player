<div class="video-container"
     [class.drag-over]="isDragOver()"
     [class.drag-invalid]="isDragInvalid()"
     [class.aspect-default]="aspectMode() === 'default'"
     [class.aspect-4-3]="aspectMode() === '4:3'"
     [class.aspect-16-9]="aspectMode() === '16:9'"
     [class.aspect-fit]="aspectMode() === 'fit'"
     [class.flip-horizontal]="flipMode() === 'horizontal'"
     [class.flip-vertical]="flipMode() === 'vertical'"
     [class.flip-both]="flipMode() === 'both'"
     (dblclick)="onDoubleClick()"
     (dragover)="onDragOver($event)"
     (dragleave)="onDragLeave($event)"
     (drop)="onDrop($event)">
  <video #videoElement crossorigin="anonymous" [style.filter]="videoFilter()"></video>
  <!-- Frozen last frame shown while a seek reloads the stream (kept in the
       DOM so the frame can be captured before the source is swapped) -->
  <canvas #freezeFrame class="seek-loading-frame" [class.active]="isSeekLoading()" [style.filter]="freezeFrameFilter()"></canvas>
  @if (isSeekLoading()) {
    <div class="seek-loading-spinner">
      <i class="fa-solid fa-circle-notch fa-spin"></i>
    </div>
  }
  @if (subtitleText()) {
    <div class="subtitle-overlay" [innerHTML]="sanitizedSubtitleHtml()"></div>
  }
</div>
